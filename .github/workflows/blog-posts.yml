name: 📝 Update Blog Posts Feed

on:
  schedule:
    # Check for new blog posts every day at 7:30 AM IST (02:00 UTC)
    - cron: "0 2 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-blog-posts:
    name: Fetch Latest Blog Posts
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Fetch Dev.to posts
        uses: gautamkrishnar/blog-post-workflow@v1
        with:
          # Update this to your actual Dev.to username when you sign up
          feed_list: "https://dev.to/feed/jsakilesh"
          max_post_count: 5
          readme_path: README.md
          comment_tag_name: BLOG-POST-LIST
          template: "[$title]($url) — *$date*\n"
          gh_token: ${{ secrets.GITHUB_TOKEN }}